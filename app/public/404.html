<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zat</title>
    <meta name="robots" content="noindex" />
    <script>
      /*
       * GitHub Pages serves this file for any path it does not have a file
       * for. Zat is a single-page app, so the real path is stashed and
       * restored by the app once it boots, which keeps deep links clean
       * (/cx/alexden/wardrobe rather than a hash URL).
       */
      (function () {
        var base = '/cx/';
        var path = location.pathname.indexOf(base) === 0 ? location.pathname.slice(base.length) : '';
        sessionStorage.setItem('zat:redirect', '/' + path + location.search + location.hash);
        location.replace(base);
      })();
    </script>
  </head>
  <body>
    <noscript><p>Zat needs JavaScript. <a href="/cx/">Open Zat</a>.</p></noscript>
  </body>
</html>
